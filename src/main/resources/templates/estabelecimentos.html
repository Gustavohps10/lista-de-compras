<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Estabelecimentos')}"></head>
<body class="bg-zinc-50 min-h-screen flex flex-col">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Cabeçalho -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Estabelecimentos & Promoções</h1>
                <p class="text-sm text-zinc-500 mt-0.5">Cadastre seus mercados e lojas favoritos e configure os dias com ofertas da semana.</p>
            </div>
            <button onclick="openModal()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm shadow-sm transition-colors self-start sm:self-auto">
                <i data-lucide="plus" class="w-4 h-4"></i> Novo Estabelecimento
            </button>
        </div>

        <!-- Grid de Estabelecimentos com Skeletons -->
        <div class="bg-white rounded-lg border border-zinc-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-zinc-100 flex items-center justify-between">
                <h2 class="font-semibold text-zinc-900 text-sm flex items-center gap-2">
                    <i data-lucide="store" class="w-4 h-4 text-emerald-600"></i> Estabelecimentos Cadastrados
                </h2>
                <span id="total-badge" class="px-2 py-0.5 rounded-md text-xs font-medium bg-zinc-100 text-zinc-600">Carregando...</span>
            </div>

            <div id="estabelecimentos-container" class="divide-y divide-zinc-100">
                <!-- Skeletons -->
                <div class="p-5 space-y-3 animate-pulse skeleton-row">
                    <div class="flex items-center justify-between">
                        <div class="space-y-2 w-1/3">
                            <div class="h-4 bg-zinc-100 rounded w-3/4"></div>
                            <div class="h-3 bg-zinc-100 rounded w-1/2"></div>
                        </div>
                        <div class="w-24 h-8 bg-zinc-100 rounded-md"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro / Edição -->
    <div id="modal-est" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl border border-zinc-200 transform transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
                <h3 id="modal-title" class="font-semibold text-base text-zinc-900">Cadastrar Estabelecimento</h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-600 rounded p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form id="form-est" onsubmit="handleSalvarEstabelecimento(event)" class="mt-4 space-y-4">
                <input type="hidden" id="est-id" value="">
                
                <div>
                    <label for="est-nome" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        Nome do Estabelecimento <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="est-nome" required placeholder="Ex: Supermercado São José, Feira da Estação" 
                           class="w-full px-3 py-2 rounded-md border border-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-950 focus:border-zinc-950 text-sm">
                    <p id="nome-error" class="hidden text-xs text-red-500 mt-1">O nome do estabelecimento é obrigatório.</p>
                </div>

                <!-- Dias da semana de promoção -->
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-2">
                        Dias de Promoção / Ofertas (Opcional)
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <label th:each="dia : ${diasSemana}" class="flex items-center gap-2 p-2 rounded-md border border-zinc-200 hover:bg-zinc-50 cursor-pointer text-xs font-medium text-zinc-700 select-none transition-colors">
                            <input type="checkbox" name="diasPromocao" th:value="${dia}" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-zinc-300">
                            <span th:text="${dia}">Segunda-feira</span>
                        </label>
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2 border-t border-zinc-100">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-md text-sm font-medium text-zinc-700 hover:bg-zinc-100 border border-zinc-200 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-1.5 rounded-md text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        function renderEstabelecimentos() {
            const container = document.getElementById('estabelecimentos-container');
            const totalBadge = document.getElementById('total-badge');
            const ests = StorageService.getEstabelecimentos();

            totalBadge.textContent = `${ests.length} local(is)`;

            if (ests.length === 0) {
                container.innerHTML = `
                    <div class="p-12 text-center text-zinc-400">
                        <i data-lucide="store" class="w-10 h-10 mx-auto mb-2 text-zinc-300"></i>
                        <p class="font-medium text-zinc-700 text-sm">Nenhum estabelecimento cadastrado.</p>
                        <p class="text-xs text-zinc-400 mt-0.5">Clique no botão "Novo Estabelecimento" acima para adicionar.</p>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = ests.map(est => {
                const diasBadges = (est.diasSemanaPromocao && est.diasSemanaPromocao.length > 0)
                    ? est.diasSemanaPromocao.map(dia => `
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200/80">
                            <i data-lucide="tag" class="w-3 h-3"></i> ${escapeHtml(dia)}
                        </span>
                    `).join('')
                    : '<span class="text-xs text-zinc-400 italic">Nenhum dia informado</span>';

                return `
                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-zinc-50/70 transition-colors">
                        <div class="flex items-start gap-3.5">
                            <div class="w-9 h-9 rounded-md bg-zinc-100 text-zinc-700 flex items-center justify-center shrink-0 mt-0.5 border border-zinc-200/50">
                                <i data-lucide="store" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold text-zinc-900 text-sm">${escapeHtml(est.nome)}</h3>
                                <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                                    <span class="text-xs text-zinc-400 font-normal mr-1">Promoções:</span>
                                    ${diasBadges}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-auto">
                            <button onclick="editarEstabelecimento('${est.id}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-700 hover:bg-zinc-100 bg-white border border-zinc-200 transition-colors">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editar
                            </button>
                            <button onclick="excluirEstabelecimento('${est.id}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 hover:text-rose-600 hover:bg-zinc-100 bg-white border border-zinc-200 transition-colors">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Excluir
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function openModal(id = '', nome = '', dias = []) {
            document.getElementById('est-id').value = id;
            document.getElementById('est-nome').value = nome;
            document.getElementById('nome-error').classList.add('hidden');
            document.getElementById('modal-title').textContent = id ? 'Editar Estabelecimento' : 'Novo Estabelecimento';
            
            // Marca os checkboxes dos dias
            const checkboxes = document.querySelectorAll('input[name="diasPromocao"]');
            checkboxes.forEach(cb => {
                cb.checked = dias.includes(cb.value);
            });

            document.getElementById('modal-est').classList.remove('hidden');
            setTimeout(() => document.getElementById('est-nome').focus(), 50);
        }

        function closeModal() {
            document.getElementById('modal-est').classList.add('hidden');
        }

        function handleSalvarEstabelecimento(event) {
            event.preventDefault();
            const id = document.getElementById('est-id').value;
            const nomeInput = document.getElementById('est-nome');
            const nome = nomeInput.value.trim();

            if (!nome) {
                document.getElementById('nome-error').classList.remove('hidden');
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="diasPromocao"]:checked');
            const dias = Array.from(checkboxes).map(cb => cb.value);

            if (id) {
                StorageService.updateEstabelecimento(id, nome, dias);
                showToast('Estabelecimento atualizado com sucesso!');
            } else {
                StorageService.addEstabelecimento(nome, dias);
                showToast('Estabelecimento cadastrado com sucesso!');
            }

            closeModal();
            renderEstabelecimentos();
        }

        function editarEstabelecimento(id) {
            const ests = StorageService.getEstabelecimentos();
            const est = ests.find(e => e.id === id);
            if (est) {
                openModal(est.id, est.nome, est.diasSemanaPromocao || []);
            }
        }

        function excluirEstabelecimento(id) {
            if (confirm('Tem certeza que deseja remover este estabelecimento?')) {
                StorageService.deleteEstabelecimento(id);
                showToast('Estabelecimento removido com sucesso!');
                renderEstabelecimentos();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderEstabelecimentos, 200);
        });
    </script>
</body>
</html>
