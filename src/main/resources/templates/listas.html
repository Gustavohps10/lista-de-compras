<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listas de Compras')}"></head>
<body class="bg-zinc-50 min-h-screen flex flex-col">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Cabeçalho da Página -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Listas de Compras</h1>
                <p class="text-sm text-zinc-500 mt-0.5">Crie nomes para suas listas de compras para organizar os itens por ocasião.</p>
            </div>
            <button onclick="openModal()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm shadow-sm transition-colors self-start sm:self-auto">
                <i data-lucide="plus" class="w-4 h-4"></i> Nova Lista
            </button>
        </div>

        <!-- Card de Listas -->
        <div class="bg-white rounded-lg border border-zinc-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-zinc-100 flex items-center justify-between">
                <h2 class="font-semibold text-zinc-900 text-sm flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-4 h-4 text-emerald-600"></i> Listas Cadastradas
                </h2>
                <span id="total-badge" class="px-2 py-0.5 rounded-md text-xs font-medium bg-zinc-100 text-zinc-600">Carregando...</span>
            </div>

            <!-- Container da Lista -->
            <div id="listas-container" class="divide-y divide-zinc-100">
                <!-- Skeletons enquanto lê o LocalStorage -->
                <div class="p-5 space-y-3 animate-pulse skeleton-row">
                    <div class="flex items-center justify-between">
                        <div class="space-y-2 w-1/3">
                            <div class="h-4 bg-zinc-100 rounded w-3/4"></div>
                            <div class="h-3 bg-zinc-100 rounded w-1/2"></div>
                        </div>
                        <div class="flex gap-2">
                            <div class="w-16 h-8 bg-zinc-100 rounded-md"></div>
                            <div class="w-16 h-8 bg-zinc-100 rounded-md"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro / Edição -->
    <div id="modal-lista" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl border border-zinc-200 transform transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
                <h3 id="modal-title" class="font-semibold text-base text-zinc-900">Cadastrar Lista de Compras</h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-600 rounded p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form id="form-lista" onsubmit="handleSalvarLista(event)" class="mt-4 space-y-4">
                <input type="hidden" id="lista-id" value="">
                
                <div>
                    <label for="lista-nome" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        Nome da Lista <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="lista-nome" required placeholder="Ex: Compras do Mês, Churrasco, Feira" 
                           class="w-full px-3 py-2 rounded-md border border-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-950 focus:border-zinc-950 text-sm">
                    <p id="nome-error" class="hidden text-xs text-red-500 mt-1">O nome da lista é obrigatório.</p>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-md text-sm font-medium text-zinc-700 hover:bg-zinc-100 border border-zinc-200 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-1.5 rounded-md text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        function renderListas() {
            const container = document.getElementById('listas-container');
            const totalBadge = document.getElementById('total-badge');
            const listas = StorageService.getListas();
            const itens = StorageService.getItens();

            totalBadge.textContent = `${listas.length} lista(s)`;

            if (listas.length === 0) {
                container.innerHTML = `
                    <div class="p-12 text-center text-zinc-400">
                        <i data-lucide="clipboard-x" class="w-10 h-10 mx-auto mb-2 text-zinc-300"></i>
                        <p class="font-medium text-zinc-700 text-sm">Nenhuma lista cadastrada ainda.</p>
                        <p class="text-xs text-zinc-400 mt-0.5">Clique no botão "Nova Lista" acima para começar.</p>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = listas.map(lista => {
                const itensDestaLista = itens.filter(i => i.listaId === lista.id);
                const valorTotal = itensDestaLista.reduce((acc, i) => acc + (i.quantidade * i.valorUnitario), 0);

                return `
                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-zinc-50/70 transition-colors">
                        <div class="flex items-start gap-3.5">
                            <div class="w-9 h-9 rounded-md bg-zinc-100 text-zinc-700 flex items-center justify-center shrink-0 mt-0.5 border border-zinc-200/50">
                                <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold text-zinc-900 text-sm">${escapeHtml(lista.nome)}</h3>
                                <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-zinc-500">
                                    <span>Criada em ${lista.dataCriacao || 'Recente'}</span>
                                    <span>•</span>
                                    <span class="font-medium text-zinc-700 bg-zinc-100 border border-zinc-200 px-2 py-0.5 rounded-md">
                                        ${itensDestaLista.length} item(ns)
                                    </span>
                                    <span>•</span>
                                    <span class="font-semibold text-emerald-700">
                                        Previsto: ${StorageService.formatMoeda(valorTotal)}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-auto">
                            <a href="/montar-lista?listaId=${lista.id}" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium bg-emerald-50 text-emerald-800 hover:bg-emerald-100 transition-colors border border-emerald-200">
                                <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Montar Itens
                            </a>
                            <button onclick="editarLista('${lista.id}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-700 hover:bg-zinc-100 bg-white border border-zinc-200 transition-colors">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editar
                            </button>
                            <button onclick="excluirLista('${lista.id}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-600 hover:text-rose-600 hover:bg-zinc-100 bg-white border border-zinc-200 transition-colors">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Excluir
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function openModal(id = '', nome = '') {
            document.getElementById('lista-id').value = id;
            document.getElementById('lista-nome').value = nome;
            document.getElementById('nome-error').classList.add('hidden');
            document.getElementById('modal-title').textContent = id ? 'Editar Lista de Compras' : 'Nova Lista de Compras';
            document.getElementById('modal-lista').classList.remove('hidden');
            setTimeout(() => document.getElementById('lista-nome').focus(), 50);
        }

        function closeModal() {
            document.getElementById('modal-lista').classList.add('hidden');
        }

        function handleSalvarLista(event) {
            event.preventDefault();
            const id = document.getElementById('lista-id').value;
            const nomeInput = document.getElementById('lista-nome');
            const nome = nomeInput.value.trim();

            if (!nome) {
                document.getElementById('nome-error').classList.remove('hidden');
                return;
            }

            if (id) {
                StorageService.updateLista(id, nome);
                showToast('Lista atualizada com sucesso!');
            } else {
                StorageService.addLista(nome);
                showToast('Lista criada com sucesso!');
            }

            closeModal();
            renderListas();
        }

        function editarLista(id) {
            const listas = StorageService.getListas();
            const lista = listas.find(l => l.id === id);
            if (lista) {
                openModal(lista.id, lista.nome);
            }
        }

        function excluirLista(id) {
            if (confirm('Tem certeza que deseja excluir esta lista? Os itens cadastrados nela também serão removidos.')) {
                StorageService.deleteLista(id);
                showToast('Lista excluída com sucesso!');
                renderListas();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderListas, 200);
        });
    </script>
</body>
</html>
