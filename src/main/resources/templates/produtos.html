<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body class="bg-zinc-50 min-h-screen flex flex-col">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Cabeçalho -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Catálogo de Produtos</h1>
                <p class="text-sm text-zinc-500 mt-0.5">Cadastre os itens que você costuma comprar, com unidade de medida e foto.</p>
            </div>
            <button onclick="openModal()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm shadow-sm transition-colors self-start sm:self-auto">
                <i data-lucide="plus" class="w-4 h-4"></i> Novo Produto
            </button>
        </div>

        <!-- Catálogo de Produtos com Skeletons -->
        <div class="bg-white rounded-lg border border-zinc-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-zinc-100 flex items-center justify-between">
                <h2 class="font-semibold text-zinc-900 text-sm flex items-center gap-2">
                    <i data-lucide="package" class="w-4 h-4 text-emerald-600"></i> Produtos Cadastrados
                </h2>
                <span id="total-badge" class="px-2 py-0.5 rounded-md text-xs font-medium bg-zinc-100 text-zinc-600">Carregando...</span>
            </div>

            <div id="produtos-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 p-4">
                <!-- Skeletons proporcionais -->
                <div class="border border-zinc-200/80 rounded-lg p-3 animate-pulse space-y-2.5">
                    <div class="w-full aspect-square bg-zinc-100 rounded-md"></div>
                    <div class="h-3 bg-zinc-100 rounded w-1/3"></div>
                    <div class="h-4 bg-zinc-100 rounded w-4/5"></div>
                    <div class="h-6 bg-zinc-100 rounded"></div>
                </div>
                <div class="border border-zinc-200/80 rounded-lg p-3 animate-pulse space-y-2.5">
                    <div class="w-full aspect-square bg-zinc-100 rounded-md"></div>
                    <div class="h-3 bg-zinc-100 rounded w-1/3"></div>
                    <div class="h-4 bg-zinc-100 rounded w-4/5"></div>
                    <div class="h-6 bg-zinc-100 rounded"></div>
                </div>
                <div class="border border-zinc-200/80 rounded-lg p-3 animate-pulse space-y-2.5">
                    <div class="w-full aspect-square bg-zinc-100 rounded-md"></div>
                    <div class="h-3 bg-zinc-100 rounded w-1/3"></div>
                    <div class="h-4 bg-zinc-100 rounded w-4/5"></div>
                    <div class="h-6 bg-zinc-100 rounded"></div>
                </div>
                <div class="border border-zinc-200/80 rounded-lg p-3 animate-pulse space-y-2.5">
                    <div class="w-full aspect-square bg-zinc-100 rounded-md"></div>
                    <div class="h-3 bg-zinc-100 rounded w-1/3"></div>
                    <div class="h-4 bg-zinc-100 rounded w-4/5"></div>
                    <div class="h-6 bg-zinc-100 rounded"></div>
                </div>
                <div class="border border-zinc-200/80 rounded-lg p-3 animate-pulse space-y-2.5">
                    <div class="w-full aspect-square bg-zinc-100 rounded-md"></div>
                    <div class="h-3 bg-zinc-100 rounded w-1/3"></div>
                    <div class="h-4 bg-zinc-100 rounded w-4/5"></div>
                    <div class="h-6 bg-zinc-100 rounded"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro / Edição -->
    <div id="modal-prod" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-md w-full p-5 shadow-xl border border-zinc-200 transform transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
                <h3 id="modal-title" class="font-semibold text-base text-zinc-900">Cadastrar Produto</h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-600 rounded p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form id="form-prod" onsubmit="handleSalvarProduto(event)" class="mt-4 space-y-4">
                <input type="hidden" id="prod-id" value="">
                
                <div>
                    <label for="prod-desc" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        Descrição do Produto <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="prod-desc" required placeholder="Ex: Arroz Branco Tipo 1 5kg" 
                           class="w-full px-3 py-2 rounded-md border border-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-950 focus:border-zinc-950 text-sm">
                    <p id="desc-error" class="hidden text-xs text-red-500 mt-1">A descrição do produto é obrigatória.</p>
                </div>

                <div>
                    <label for="prod-unidade" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        Unidade de Medida <span class="text-red-500">*</span>
                    </label>
                    <select id="prod-unidade" required class="w-full px-3 py-2 rounded-md border border-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-950 focus:border-zinc-950 text-sm bg-white">
                        <option th:each="un : ${unidadesMedida}" th:value="${un}" th:text="${un}">Unidade (un)</option>
                    </select>
                </div>

                <div>
                    <label for="prod-foto" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        Foto / Imagem do Produto (URL)
                    </label>
                    <input type="url" id="prod-foto" placeholder="https://images.unsplash.com/..." 
                           class="w-full px-3 py-2 rounded-md border border-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-950 focus:border-zinc-950 text-sm">
                    <p class="text-xs text-zinc-400 mt-1">Insira o link de uma imagem da internet.</p>
                </div>

                <div class="pt-2 flex justify-end gap-2 border-t border-zinc-100">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-md text-sm font-medium text-zinc-700 hover:bg-zinc-100 border border-zinc-200 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-1.5 rounded-md text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        function renderProdutos() {
            const container = document.getElementById('produtos-container');
            const totalBadge = document.getElementById('total-badge');
            const produtos = StorageService.getProdutos();

            totalBadge.textContent = `${produtos.length} produto(s)`;

            if (produtos.length === 0) {
                container.className = 'p-12 text-center text-zinc-400';
                container.innerHTML = `
                    <i data-lucide="package-x" class="w-10 h-10 mx-auto mb-2 text-zinc-300"></i>
                    <p class="font-medium text-zinc-700 text-sm">Nenhum produto cadastrado.</p>
                    <p class="text-xs text-zinc-400 mt-0.5">Clique no botão "Novo Produto" acima para adicionar.</p>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 p-4';
            container.innerHTML = produtos.map(prod => {
                const imagemHtml = prod.fotoUrl ? `
                    <div class="w-full aspect-square rounded-md overflow-hidden bg-zinc-100 border border-zinc-200/80 mb-2.5 relative">
                        <img src="${escapeHtml(prod.fotoUrl)}" alt="${escapeHtml(prod.descricao)}" 
                             loading="lazy"
                             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80';"
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                ` : `
                    <div class="w-full aspect-square bg-zinc-50 rounded-md mb-2.5 flex flex-col items-center justify-center text-zinc-400 border border-dashed border-zinc-200">
                        <i data-lucide="image" class="w-6 h-6 mb-1 text-zinc-300"></i>
                        <span class="text-[11px]">Sem foto</span>
                    </div>
                `;

                return `
                    <div class="bg-white border border-zinc-200/80 rounded-lg p-3 shadow-sm hover:border-zinc-300 hover:shadow transition-all flex flex-col justify-between group">
                        <div>
                            ${imagemHtml}
                            <div class="mb-1">
                                <span class="inline-block px-1.5 py-0.5 rounded text-[11px] font-medium bg-zinc-100 text-zinc-700 border border-zinc-200/60">
                                    ${escapeHtml(prod.unidadeMedida || 'Unidade (un)')}
                                </span>
                            </div>
                            <h3 class="font-medium text-zinc-900 text-xs leading-snug line-clamp-2 h-8" title="${escapeHtml(prod.descricao)}">
                                ${escapeHtml(prod.descricao)}
                            </h3>
                        </div>
                        <div class="mt-3 pt-2.5 border-t border-zinc-100 flex items-center justify-end gap-1.5">
                            <button onclick="editarProduto('${prod.id}')" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium text-zinc-700 hover:bg-zinc-100 border border-zinc-200 transition-colors">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> Editar
                            </button>
                            <button onclick="excluirProduto('${prod.id}')" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium text-zinc-600 hover:text-rose-600 hover:bg-zinc-100 border border-zinc-200 transition-colors">
                                <i data-lucide="trash-2" class="w-3 h-3"></i> Excluir
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function openModal(id = '', desc = '', unidade = '', foto = '') {
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-desc').value = desc;
            document.getElementById('prod-unidade').value = unidade || 'Unidade (un)';
            document.getElementById('prod-foto').value = foto;
            document.getElementById('desc-error').classList.add('hidden');
            document.getElementById('modal-title').textContent = id ? 'Editar Produto' : 'Novo Produto';
            
            document.getElementById('modal-prod').classList.remove('hidden');
            setTimeout(() => document.getElementById('prod-desc').focus(), 50);
        }

        function closeModal() {
            document.getElementById('modal-prod').classList.add('hidden');
        }

        function handleSalvarProduto(event) {
            event.preventDefault();
            const id = document.getElementById('prod-id').value;
            const desc = document.getElementById('prod-desc').value.trim();
            const unidade = document.getElementById('prod-unidade').value;
            const foto = document.getElementById('prod-foto').value.trim();

            if (!desc) {
                document.getElementById('desc-error').classList.remove('hidden');
                return;
            }

            if (id) {
                StorageService.updateProduto(id, desc, unidade, foto);
                showToast('Produto atualizado com sucesso!');
            } else {
                StorageService.addProduto(desc, unidade, foto);
                showToast('Produto cadastrado com sucesso!');
            }

            closeModal();
            renderProdutos();
        }

        function editarProduto(id) {
            const produtos = StorageService.getProdutos();
            const prod = produtos.find(p => p.id === id);
            if (prod) {
                openModal(prod.id, prod.descricao, prod.unidadeMedida, prod.fotoUrl);
            }
        }

        function excluirProduto(id) {
            if (confirm('Tem certeza que deseja excluir este produto do catálogo?')) {
                StorageService.deleteProduto(id);
                showToast('Produto removido com sucesso!');
                renderProdutos();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderProdutos, 200);
        });
    </script>
</body>
</html>
